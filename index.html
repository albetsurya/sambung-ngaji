<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />

    <meta name="theme-color" content="#E7ECE8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/apple-touch-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/apple-touch-icon-120x120.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pengajian" />

    <meta property="og:title" content="Pengajian" />
    <meta
      property="og:description"
      content="Aplikasi manajemen pengajian: biodata jamaah, absensi, monitoring, dan pengumuman."
    />
    <meta
      property="og:image"
      content="https://manajemen-pengajian-five.vercel.app/og-image.png"
    />
    <meta
      property="og:url"
      content="https://manajemen-pengajian-five.vercel.app/"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pengajian" />
    <meta
      name="twitter:description"
      content="Aplikasi manajemen pengajian: biodata jamaah, absensi, monitoring, dan pengumuman."
    />
    <meta
      name="twitter:image"
      content="https://manajemen-pengajian-five.vercel.app/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Pengajian</title>

    <!--
      Swap aset & meta ke versi DEV kalau host mengandung -dev (atau localhost).
      Diletakkan paling bawah di <head> supaya semua tag target sudah ada di DOM.
    -->
    <script>
      (function () {
        var host = window.location.hostname || "";
        var isDev =
          host === "localhost" ||
          host === "127.0.0.1" ||
          host.indexOf("-dev") !== -1;
        if (!isDev) return;

        var setHref = function (selector, href) {
          var el = document.querySelector(selector);
          if (el) el.setAttribute("href", href);
        };
        var setContent = function (selector, content) {
          var el = document.querySelector(selector);
          if (el) el.setAttribute("content", content);
        };

        // --- Favicon / apple-touch-icon ---
        setHref('link[rel="icon"][type="image/svg+xml"]', "/favicon-dev.svg");
        setHref('link[rel="icon"][sizes="32x32"]', "/favicon-32x32-dev.png");
        setHref('link[rel="icon"][sizes="16x16"]', "/favicon-16x16-dev.png");
        setHref('link[rel="shortcut icon"]', "/favicon-dev.ico");
        setHref(
          'link[rel="apple-touch-icon"][sizes="180x180"]',
          "/apple-touch-icon-dev.png",
        );
        setHref(
          'link[rel="apple-touch-icon"][sizes="152x152"]',
          "/apple-touch-icon-152x152-dev.png",
        );
        setHref(
          'link[rel="apple-touch-icon"][sizes="120x120"]',
          "/apple-touch-icon-120x120-dev.png",
        );

        // --- PWA manifest (dipakai saat "Add to Home Screen") ---
        setHref('link[rel="manifest"]', "/manifest-dev.webmanifest");

        // --- Warna & judul ---
        setContent('meta[name="theme-color"]', "#DC2626");
        document.title = "Pengajian (DEV)";
        setContent('meta[name="apple-mobile-web-app-title"]', "Pengajian DEV");

        // --- Open Graph / Twitter ---
        setContent('meta[property="og:title"]', "Pengajian (DEV)");
        setContent(
          'meta[property="og:image"]',
          "https://manajemen-pengajian-five.vercel.app/og-image-dev.png",
        );
        setContent('meta[name="twitter:title"]', "Pengajian (DEV)");
        setContent(
          'meta[name="twitter:image"]',
          "https://manajemen-pengajian-five.vercel.app/og-image-dev.png",
        );
      })();
    </script>
  </head>
  <body class="bg-surface-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
