<svg viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradien Background Utama -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Gradien Kilau Atas -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradien Badge DEV Red -->
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Shadow untuk Kartu & Badge -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Utama -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="256" rx="120" fill="url(#shine)" />

  <!-- Bayangan / Layer Kartu Belakang -->
  <rect x="128" y="128" width="256" height="288" rx="28" fill="#ffffff" opacity="0.18" />

  <!-- Kartu Putih Utama -->
  <g filter="url(#shadow)">
    <rect x="148" y="108" width="216" height="288" rx="24" fill="#ffffff" />
  </g>

  <!-- Baris Checklist 1 -->
  <g>
    <circle cx="192" cy="176" r="18" fill="url(#bg)" />
    <path d="M185 176 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="228" y="168" width="108" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Baris Checklist 2 -->
  <g>
    <circle cx="192" cy="240" r="18" fill="url(#bg)" />
    <path d="M185 240 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="228" y="232" width="88" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Baris Checklist 3 -->
  <g>
    <circle cx="192" cy="304" r="18" fill="url(#bg)" />
    <path d="M185 304 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="228" y="296" width="98" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Badge DEV (Pojok Kanan Atas) -->
  <g transform="translate(340, 55) rotate(12)" filter="url(#shadow)">
    <rect x="0" y="0" width="132" height="60" rx="18" fill="url(#badge)" stroke="#FFFFFF" stroke-width="5" />
    <text x="66" y="41" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">DEV</text>
  </g>
</svg>