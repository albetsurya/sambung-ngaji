<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradien utama: biru (kiri atas) -> ungu (kanan bawah) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Gradien kartu putih -->
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Gradien badge merah -->
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Gradien centang (biru -> ungu, senada ikon) -->
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Shadow kartu -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />

  <!-- Kartu putih -->
  <g filter="url(#cardShadow)">
    <rect x="146" y="106" width="220" height="300" rx="28" ry="28" fill="url(#card)" />
  </g>

  <!-- Baris 1: centang + garis -->
  <g>
    <!-- lingkaran centang -->
    <circle cx="196" cy="182" r="20" fill="url(#check)" />
    <path d="M187 182 l7 7 l13 -14"
          fill="none" stroke="#FFFFFF" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <!-- garis isi -->
    <rect x="232" y="174" width="104" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Baris 2 -->
  <g>
    <circle cx="196" cy="256" r="20" fill="url(#check)" />
    <path d="M187 256 l7 7 l13 -14"
          fill="none" stroke="#FFFFFF" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="232" y="248" width="104" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Baris 3 -->
  <g>
    <circle cx="196" cy="330" r="20" fill="url(#check)" />
    <path d="M187 330 l7 7 l13 -14"
          fill="none" stroke="#FFFFFF" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="232" y="322" width="104" height="16" rx="8" fill="#CBD5E1" />
  </g>

  <!-- Badge DEV di pojok kanan atas -->
  <g transform="translate(360 60) rotate(12)">
    <rect x="0" y="0" width="132" height="60" rx="18" ry="18"
          fill="url(#badge)" stroke="#FFFFFF" stroke-width="6" />
    <text x="66" y="40"
          font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
          font-size="34" font-weight="800" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="2">DEV</text>
  </g>
</svg>